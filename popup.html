<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>哔哩清风</title><link rel="stylesheet" href="popup.css"></head>
<body><header class="brand"><img src="icons/128.png" width="48" height="48" alt=""><h1>哔哩清风</h1></header>
<nav class="tabs" role="tablist" aria-label="设置分类"><button type="button" role="tab" id="tab-filter" aria-controls="panel-filter" aria-selected="true" tabindex="0">过滤</button><button type="button" role="tab" id="tab-lists" aria-controls="panel-lists" aria-selected="false" tabindex="-1">名单</button><button type="button" role="tab" id="tab-api" aria-controls="panel-api" aria-selected="false" tabindex="-1">API</button></nav><form id="settings"><div class="column" id="panel-filter" role="tabpanel" aria-labelledby="tab-filter">
<div id="filterOverview"><h2 class="group-title" id="scope-title">识别范围</h2>
<section class="switch-group" aria-labelledby="scope-title"><label class="row">启用过滤<input id="enabled" type="checkbox" role="switch"></label>
<label class="row">动态<input id="dynamics" type="checkbox" role="switch"></label>
<label class="row">视频置顶评论<input id="pinned" type="checkbox" role="switch"></label></section>
<h2 class="group-title" id="category-title">自动折叠</h2>
<section class="switch-group" aria-labelledby="category-title"><label class="row">广告<input type="checkbox" id="fold_ad" role="switch"></label><label class="row">抽奖<input type="checkbox" id="fold_giveaway" role="switch"></label><label class="row incidental-option">包含附带抽奖<input type="checkbox" id="foldIncidental" role="switch"></label><label class="row">活动宣传<input type="checkbox" id="fold_event" role="switch"></label><label class="row">招聘<input type="checkbox" id="fold_recruitment" role="switch"></label></section>
<button type="button" id="openRules" class="rules-link">过滤强度 →</button></div><div id="filterRules" hidden><button type="button" id="backRules">← 返回过滤</button><section class="rules-card"><label class="rule-label" for="adThresholdNumber">广告折叠阈值</label><div class="percent-control"><input type="range" id="adThresholdRange" min="1" max="100" step="1" aria-label="广告折叠阈值滑条"><span><input type="number" id="adThresholdNumber" min="1" max="100" step="1" aria-label="广告折叠阈值">%</span></div><label class="rule-label" for="cautiousThresholdNumber">谨慎模式阈值</label><div class="percent-control"><input type="range" id="cautiousThresholdRange" min="1" max="100" step="1" aria-label="谨慎模式阈值滑条"><span><input type="number" id="cautiousThresholdNumber" min="1" max="100" step="1" aria-label="谨慎模式阈值">%</span></div><label class="rule-label" for="ratioThresholdNumber">自动启用的广告占比</label><div class="percent-control"><input type="range" id="ratioThresholdRange" min="1" max="100" step="1" aria-label="自动启用的广告占比滑条"><span><input type="number" id="ratioThresholdNumber" min="1" max="100" step="1" aria-label="自动启用的广告占比">%</span></div><label class="row">统计动态条数<input type="number" id="ratioWindow" min="2" max="100" step="1" aria-label="统计动态条数"></label><label class="row">自动启用谨慎模式<input type="checkbox" id="autoCautious" role="switch"></label></section><p class="muted">广告置信度达到阈值时折叠。UP 主达到指定广告占比后，自动加入谨慎过滤名单并持续生效。可在「名单」中查看或移除。</p></div>
</div><div class="column" id="panel-lists" role="tabpanel" aria-labelledby="tab-lists" hidden><section><h2>始终显示</h2><p class="muted">始终显示这位 UP 主的内容。</p><div class="uid-add"><input id="whitelistQuery" aria-label="始终显示 UID" placeholder="输入 UID" inputmode="numeric"><button type="button" id="whitelistAdd">添加</button></div><p id="whitelistStatus" class="muted" role="status"></p><div id="whitelist"></div></section>
<section><h2>谨慎过滤</h2><p class="muted">仅折叠达到谨慎阈值的广告。抽奖、活动和招聘按分类开关处理。</p><div class="uid-add"><input id="enhancedListQuery" aria-label="谨慎过滤 UID" placeholder="输入 UID" inputmode="numeric"><button type="button" id="enhancedListAdd">添加</button></div><p id="enhancedListStatus" class="muted" role="status"></p><div id="enhancedList"></div></section></div><div class="column" id="panel-api" role="tabpanel" aria-labelledby="tab-api" hidden><section><label class="row">API 服务<select id="provider"><option value="jev">Jev 官方</option><option value="custom">第三方 / 自定义</option></select></label>
<div id="customFields" hidden>
<label class="row">接口协议<select id="apiProtocol"><option value="openai">OpenAI 兼容</option><option value="jev">Jev 兼容</option></select></label>
<div class="api-field"><label for="apiUrl">API 地址</label><input id="apiUrl" type="url" placeholder="https://example.com/v1/chat/completions" autocomplete="off"></div>
<div class="api-field"><label for="apiModel">模型名称</label><input id="apiModel" type="text" placeholder="填写服务商的模型名称" autocomplete="off"></div>
</div>
<div class="api-field"><label for="apiKey">API Key</label>
<input id="apiKey" type="password" placeholder="apikey_…" autocomplete="off" spellcheck="false"></div>
<p class="muted"><span id="endpointNote">直连 api.typesafe.ai · jev-latest</span><br>密钥仅存本机。识别会将文字、标题和链接发送给 API 服务商并使用你的额度；不读取图片或视频。</p>
<div class="buttons"><button type="submit">保存 API 设置</button><button id="test" type="button">测试连接</button><button id="clear" type="button">删除密钥</button></div></section>
</div></form><footer><p><a href="history.html" target="_blank" rel="noopener">记录与统计 →</a></p><p id="status" role="status" aria-live="polite"></p></footer><script src="popup.js"></script></body></html>
